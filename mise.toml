[env]
MISE_USE_VERSIONS_HOST = "0"

[tools]
actionlint = "latest"
hk = "latest"
lua = "5.4"
lua-language-server = "latest"
pkl = "latest"
stylua = "latest"
uv = "latest"

[tasks.lint]
description = "Lint Lua scripts and GitHub Actions using hk"
run = "hk check"

[tasks.lint-fix]
description = "Fix linting issues"
run = "hk fix"

[tasks.test]
description = "Run the test suite in Alpine Linux with Podman"
run = """
podman build --tag localhost/dir-hash-env-test --file Containerfile .
podman run --rm --network=none localhost/dir-hash-env-test
"""

[tasks."test:python"]
description = "Run the Python integration tests in the current environment"
run = "python3 tests/test.py"
